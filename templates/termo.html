<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LussLibras</title>

<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">

  <header class="site-header">
    <div class="header-top">
      <a href="{{ url_for('index') }}" class="brand" style="text-decoration:none;">
        <img src="{{ url_for('static', filename='Logo_LussLibras.png') }}" alt="LussLibras Logo" class="brand-logo">
      </a>

      <a href="{{ url_for('categoria') }}" class="back-link" id="back-link" aria-label="Voltar para Categorias">
        <svg width="24" height="24" viewBox="0 0 512.052 512.052" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M510.207,414.676c-2.32-23.264-6.805-47.255-14.019-71.608C461.49,226.023,355.26,143.933,234.667,138.804V53.362 c0-19.006-22.979-28.524-36.418-15.085l-192,192c-8.331,8.331-8.331,21.839,0,30.17l192,192 c13.439,13.439,36.418,3.921,36.418-15.085V327.656c48.213-4.823,103.873,7.119,157.335,48.352 c29.572,22.808,56.566,53.666,80.333,93.599C483.421,488.234,512,480.372,512,458.696c0.005-0.959,0.005-0.959,0.025-2.725 C512.165,442.689,511.785,430.503,510.207,414.676z M418.059,342.222c-66.551-51.328-136.755-64.332-197.184-55.876 c-5.85,0.818-10.162,1.676-12.758,2.331c-9.476,2.39-16.117,10.913-16.117,20.686v76.497L51.503,245.362L192,104.866v55.163 c0,12.07,10.005,21.737,22.069,21.321c0.863-0.03,1.551-0.045,3.33-0.076c108.78-2.351,206.919,69.472,237.882,173.917 c2.832,9.56,5.193,19.068,7.124,28.488C448.369,367.975,433.564,354.18,418.059,342.222z"/>
        </svg>
      </a>
    </div>

    <form class="search-form" id="search-form" role="search" action="{{ url_for('index') }}" method="GET">
      <label for="search-input" class="sr-only" style="position:absolute;left:-9999px;">Buscar termo</label>
      <input id="search-input" name="q" type="text" placeholder="Digite o termo... (ex: SQL)" autocomplete="off">
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </header>

  <main id="term-content">
    <!-- preenchido via JS -->
  </main>

  <footer class="site-footer">
    &copy; 2026 · Desenvolvido por Maicon Lussanrriaga
  </footer>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script>
  // Redireciona para os resultados na home ao buscar
  document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const query = document.getElementById("search-input").value.trim();
    if (query) {
      window.location.href = "/?q=" + encodeURIComponent(query);
    }
  });

  const catId = getParam("cat");
  const termId = getParam("termo");
  const categoria = LUSSLIBRAS_DATA[catId];
  const termo = categoria ? categoria.terms[termId] : null;

  document.getElementById("back-link").href = catId
    ? `/categoria?cat=${catId}`
    : "/";

  const content = document.getElementById("term-content");

  const playIcon = `
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 5.5V18.5L19 12L8 5.5Z" fill="#1d4ed8"/>
    </svg>`;

  // Monta o bloco de vídeo: capa azul com botão de play branco centralizado.
  // Ao clicar, troca a capa pelo player de vídeo
  // e já manda tocar.
  function renderVideo(url, label, uid) {
    if (!url) {
      return `<div class="video-frame video-frame--empty">
        <p class="video-unavailable" style="color:#fff;">Vídeo ainda não disponível.</p>
      </div>`;
    }
    const embed = url;
    return `<div class="video-frame" id="frame-${uid}" style="position:relative;background:#1d4ed8;aspect-ratio:16/9;overflow:hidden;border-radius:8px;">
      <button class="play-btn" onclick="tocarVideo('${uid}', '${embed}')" aria-label="Reproduzir ${label}"
        style="position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:transparent;border:none;cursor:pointer;padding:0;">
        <span style="width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25);">
          ${playIcon}
        </span>
      </button>
    </div>`;
  }

  // Chamada pelo botão de play: troca a capa azul pelo iframe/video de fato.
window.tocarVideo = function(uid, embed) {
  const frame = document.getElementById(`frame-${uid}`);
  if (!frame) return;

  frame.innerHTML = `<video controls muted controlsList="nodownload" autoplay width="100%" height="100%"
    style="position:absolute;inset:0;object-fit:cover;"
    src="${embed}">
  </video>`;
};

  // Monta o HTML de crédito/fonte do vídeo do SINAL (a explicação não leva fonte).
  // termo.fonte é uma string simples com o nome do canal/instituto.
  // Se não houver termo.fonte definido, mostra um aviso padrão.
  function renderFonte(fonte) {
    if (!fonte) {
      return `<p class="video-source video-source--missing" style="text-align:center;">Fonte do vídeo não informada.</p>`;
    }
    return `<p class="video-source" style="text-align:center;">Fonte: ${fonte}</p>`;
  }

  if (!termo) {
    content.innerHTML = `<p class="empty-state">Termo não encontrado. Volte e escolha um termo válido.</p>`;
  } else {
    document.title = `LUSSLIBRAS — ${termo.title}`;
    content.innerHTML = `
      <section class="video-block">
        <h1 class="video-title">${termo.title}</h1>
        ${renderVideo(termo.video_sinal_url, `Sinal em Libras para ${termo.title}`, 'sinal')}
        ${renderFonte(termo.fonte)}
      </section>

      <section class="video-block">
        <h2 class="video-title">descrição</h2>
        ${renderVideo(termo.video_explicacao_url, `Descrição em Libras para ${termo.title}`, 'explicacao')}
        <p class="description-text">${termo.description}</p>
      </section>
    `;
  }
</script>
</body>
</html>
