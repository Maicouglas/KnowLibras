<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOWLIBRAS — Termo</title>

<!-- Evita erro 404 do favicon no terminal -->
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">

  <header class="site-header">
    <div class="header-top">
      <a href="{{ url_for('index') }}" class="brand" style="text-decoration:none;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7 12.5V6.5C7 5.67 7.67 5 8.5 5C9.33 5 10 5.67 10 6.5V11" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M10 11V5.5C10 4.67 10.67 4 11.5 4C12.33 4 13 4.67 13 5.5V11" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M13 11V6.5C13 5.67 13.67 5 14.5 5C15.33 5 16 5.67 16 6.5V13" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16 13V8.5C16 7.67 16.67 7 17.5 7C18.33 7 19 7.67 19 8.5V15C19 18.31 16.31 21 13 21H12C9.5 21 8 20 6.5 18L4.3 15.2C3.9 14.7 4 13.98 4.5 13.6C5.05 13.19 5.82 13.28 6.26 13.79L7 14.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        KNOWLIBRAS
      </a>

      <a href="#" class="back-link" id="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Voltar
      </a>
    </div>

    <form class="search-form" id="search-form" role="search" action="{{ url_for('index') }}" method="GET">
      <label for="search-input" class="sr-only" style="position:absolute;left:-9999px;">Buscar termo</label>
      <input id="search-input" name="q" type="text" placeholder="Digite o termo... (ex: SQL)" autocomplete="off">
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </header>

  <main id="term-content">
    <!-- preenchido via JS -->
  </main>

  <footer class="site-footer">
    &copy; 2026 · Desenvolvido por Maicon Lussanrriaga
  </footer>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script>
  // Redireciona para os resultados na home ao buscar
  document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const query = document.getElementById("search-input").value.trim();
    if (query) {
      window.location.href = "/?q=" + encodeURIComponent(query);
    }
  });

  const catId = getParam("cat");
  const termId = getParam("termo");
  const categoria = KNOWLIBRAS_DATA[catId];
  const termo = categoria ? categoria.terms[termId] : null;

  document.getElementById("back-link").href = catId
    ? `/categoria?cat=${catId}`
    : "/";

  const content = document.getElementById("term-content");

  const playIcon = `
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 5.5V18.5L19 12L8 5.5Z" fill="currentColor"/>
    </svg>`;

  // Monta o HTML de crédito/fonte do vídeo do SINAL (a explicação não leva fonte).
  // termo.fonte é uma string simples com o nome do canal/instituto.
  // Se não houver termo.fonte definido, mostra um aviso padrão.
  function renderFonte(fonte) {
    if (!fonte) {
      return `<p class="video-source video-source--missing">Fonte do vídeo não informada.</p>`;
    }
    return `<p class="video-source">Fonte: ${fonte}</p>`;
  }

  if (!termo) {
    content.innerHTML = `<p class="empty-state">Termo não encontrado. Volte e escolha um termo válido.</p>`;
  } else {
    document.title = `KNOWLIBRAS — ${termo.title}`;
    content.innerHTML = `
      <section class="video-block">
        <h1 class="video-title">${termo.title}</h1>
        <div class="video-frame">
          <button class="play-btn" aria-label="Reproduzir vídeo do sinal em Libras para ${termo.title}">
            ${playIcon}
          </button>
        </div>
        ${renderFonte(termo.fonte)}
      </section>

      <section class="video-block">
        <h2 class="video-title">descrição</h2>
        <div class="video-frame">
          <button class="play-btn" aria-label="Reproduzir vídeo da descrição em Libras para ${termo.title}">
            ${playIcon}
          </button>
        </div>
        <p class="description-text">${termo.description}</p>
      </section>
    `;
  }
</script>
</body>
</html>
