<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LussLibras — Categoria</title>

<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">

  <header class="site-header">
    <div class="header-top">
  <a href="{{ url_for('index') }}" class="brand" style="text-decoration:none;">
    <img src="{{ url_for('static', filename='Logo_LussLibras.png') }}" alt="LussLibras Logo" class="brand-logo">
  </a>

  <!-- Link apenas com o ícone Home ampliado -->
  <a href="{{ url_for('index') }}" class="back-link" aria-label="Início">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
  </a>
</div>

    <form class="search-form" id="search-form" role="search" action="{{ url_for('index') }}" method="GET">
      <label for="search-input" class="sr-only" style="position:absolute;left:-9999px;">Buscar termo</label>
      <input id="search-input" name="q" type="text" placeholder="Digite o termo... (ex: SQL)" autocomplete="off">
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </header>

 <main>
    <h1 class="page-title" id="category-title">Categoria</h1><ul class="term-list" id="term-list"></ul>
  </main>

  <footer class="site-footer">
    &copy; 2026 · Desenvolvido por Maicon Lussanrriaga
  </footer>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script>
  // Redireciona para os resultados na home ao buscar
  document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const query = document.getElementById("search-input").value.trim();
    if (query) {
      window.location.href = "/?q=" + encodeURIComponent(query);
    }
  });

  const catId = getParam("cat");
  const categoria = LUSSLIBRAS_DATA[catId];
  const titleEl = document.getElementById("category-title");
  const listEl = document.getElementById("term-list");

  if (!categoria) {
    titleEl.textContent = "Categoria não encontrada";
    listEl.innerHTML = `<li class="empty-state">Volte para o início e escolha uma categoria válida.</li>`;
  } else {
    titleEl.textContent = categoria.label.toUpperCase();
    Object.entries(categoria.terms).forEach(([termId, termo]) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "term-card";
      a.href = `/termo?cat=${catId}&termo=${termId}`;
      a.innerHTML = `${termo.title}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      li.appendChild(a);
      listEl.appendChild(li);
    });
  }
</script>
</body>
</html>
