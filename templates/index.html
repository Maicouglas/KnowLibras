<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LussLibras</title>

<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app-shell">

  <header class="site-header">
    <div class="header-top">
      <a href="{{ url_for('index') }}" class="brand" style="text-decoration:none;">
        <img src="{{ url_for('static', filename='Logo_LussLibras.png') }}" alt="LussLibras Logo" class="brand-logo">
      </a>
    </div>
    <form class="search-form" id="search-form" role="search">
      <label for="search-input" class="sr-only" style="position:absolute;left:-9999px;">Buscar termo</label>
      <input id="search-input" name="q" type="text" placeholder="Digite o termo... (ex: SQL)" autocomplete="off">
      <button type="submit" aria-label="Buscar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </header>

  <main style="user-select: none;">
    <div id="search-results" hidden>
      <p class="section-label">Resultados da busca</p>
      <ul class="term-list" id="search-results-list"></ul>
    </div>
    
    <div id="categories-block">
      <p class="section-label" style="text-align: center; margin-bottom: 12px;">Ou navegue por categorias:</p>
      <ul class="category-list" id="category-list"></ul>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 · Desenvolvido por Maicon Lussanrriaga
  </footer>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/data.js') }}"></script>
<script>
  const categoryList = document.getElementById("category-list");
  Object.entries(LUSSLIBRAS_DATA).forEach(([catId, categoria]) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "category-card";
    a.href = `/categoria?cat=${catId}`;
    a.innerHTML = `
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 6H20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 12H20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 18H14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      ${categoria.label}
    `;
    li.appendChild(a);
    categoryList.appendChild(li);
  });

  const form = document.getElementById("search-form");
  const input = document.getElementById("search-input");
  const resultsBlock = document.getElementById("search-results");
  const resultsList = document.getElementById("search-results-list");
  const categoriesBlock = document.getElementById("categories-block");

  function renderResults(query) {
    const resultados = buscarTermos(query);
    resultsList.innerHTML = "";

    if (!query.trim()) {
      resultsBlock.hidden = true;
      categoriesBlock.hidden = false;
      return;
    }

    resultsBlock.hidden = false;
    categoriesBlock.hidden = true;

    if (resultados.length === 0) {
      resultsList.innerHTML = `<li class="empty-state">Nenhum termo encontrado para "${query}".</li>`;
      return;
    }

    resultados.forEach(({ catId, termId, title }) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "term-card";
      a.href = `/termo?cat=${catId}&termo=${termId}`;
      a.innerHTML = `${title}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      li.appendChild(a);
      resultsList.appendChild(li);
    });
  }

  // Captura busca vinda do Flask/URL ao carregar a página
  const urlQuery = "{{ query }}";
  if (urlQuery) {
    input.value = urlQuery;
    renderResults(urlQuery);
  }

  input.addEventListener("input", () => renderResults(input.value));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    renderResults(input.value);
  });
</script>
</body>
</html>
